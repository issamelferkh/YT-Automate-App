<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automated Video Engine</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 32px;
      color: #202124;
      background: #f6f8f5;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
    }

    .top-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .top-menu a {
      border: 1px solid #c9c9c3;
      border-radius: 6px;
      padding: 9px 12px;
      color: #202124;
      background: #fff;
      text-decoration: none;
      font-weight: 650;
    }

    .top-menu a[aria-current="page"] {
      border-color: #1f5f52;
      color: #1f5f52;
      background: #e8f2ef;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      box-sizing: border-box;
      border: 1px solid #c9c9c3;
      border-radius: 6px;
      padding: 14px;
      resize: vertical;
      font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      gap: 24px;
      align-items: start;
    }

    .status-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .status-list li {
      margin: 0 0 10px;
      padding: 12px;
      border: 1px solid #d3d5cf;
      border-radius: 6px;
      background: #fff;
    }

    .status-list strong {
      display: block;
      margin-bottom: 4px;
    }

    video {
      display: block;
      width: 100%;
      margin-top: 8px;
      border-radius: 6px;
      background: #111;
    }

    .message {
      min-height: 24px;
      color: #5d635f;
    }

    .error {
      color: #a4262c;
    }

    @media (max-width: 820px) {
      body {
        padding: 20px;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav class="top-menu" aria-label="Main menu">
      <a href="index.html">Home</a>
      <a href="page1.html">Generate JSON</a>
      <a aria-current="page" href="page2.html">Download Video</a>
      <a href="page3.html">Generate Voice</a>
    </nav>

    <h1>Automated Video Engine</h1>
    <p>Paste a JSON array of segments. Each segment must include a manual <code>query</code> field. Selected videos must be horizontal YouTube format only: Full HD 1920x1080 or HD 1280x720, 8-10 seconds long.</p>

    <div class="layout">
      <section>
        <label for="segmentsInput">Segments JSON</label>
        <textarea id="segmentsInput" spellcheck="false" placeholder='[
  {
    "start": 0,
    "end": 10,
    "text": "segment text...",
    "query": "city skyline sunrise"
  }
]'></textarea>
        <p id="message" class="message" aria-live="polite"></p>
      </section>

      <section>
        <h2>Status</h2>
        <ol id="statusList" class="status-list" aria-live="polite"></ol>
      </section>
    </div>
  </main>

  <script>
    const API_URL = 'api.php';
    const FALLBACK_QUERY = 'business background';
    const MIN_DURATION_SECONDS = 8;
    const MAX_DURATION_SECONDS = 10;
    const ALLOWED_VIDEO_SIZES = [
      { width: 1920, height: 1080, label: 'Full HD 1920x1080' },
      { width: 1280, height: 720, label: 'HD 1280x720' }
    ];
    const input = document.getElementById('segmentsInput');
    const message = document.getElementById('message');
    const statusList = document.getElementById('statusList');

    let debounceTimer = 0;
    let isProcessing = false;
    let lastRunSignature = '';
    let currentRunId = 0;

    function parseSegments(value) {
      const parsed = JSON.parse(value);
      const segments = Array.isArray(parsed) ? parsed : parsed.segments;

      if (!Array.isArray(segments)) {
        throw new Error('JSON must be an array, or an object with a segments array.');
      }

      return segments.map((segment, index) => {
        const query = typeof segment.query === 'string' ? segment.query.trim() : '';
        if (!query) {
          throw new Error(`Segment ${index + 1} is missing a query field.`);
        }

        return {
          ...segment,
          index: index + 1,
          query
        };
      });
    }

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
    }

    function resetStatus(segments) {
      statusList.innerHTML = '';
      segments.forEach((segment) => {
        const item = document.createElement('li');
        item.id = `segment-${segment.index}`;
        item.innerHTML = `<strong>Segment ${segment.index}</strong><span>Queued: ${escapeHtml(segment.query)}</span>`;
        statusList.appendChild(item);
      });
    }

    function updateStatus(index, text, localPath = '') {
      const item = document.getElementById(`segment-${index}`);
      if (!item) {
        return;
      }

      const preview = localPath
        ? `<video src="${encodeURI(localPath)}" controls muted playsinline></video>`
        : '';
      item.innerHTML = `<strong>Segment ${index}</strong><span>${escapeHtml(text)}</span>${preview}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function searchPexels(query) {
      const params = new URLSearchParams({ action: 'search', query });
      const response = await fetch(`${API_URL}?${params.toString()}`);
      const payload = await response.json();

      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || `Search failed for "${query}".`);
      }

      return Array.isArray(payload.videos) ? payload.videos : [];
    }

    function isAllowedYoutubeFormat(file) {
      const width = Number(file.width || 0);
      const height = Number(file.height || 0);

      return ALLOWED_VIDEO_SIZES.some((size) => (
        width === size.width && height === size.height
      ));
    }

    function formatLabel(width, height) {
      const match = ALLOWED_VIDEO_SIZES.find((size) => size.width === width && size.height === height);
      return match ? match.label : `${width}x${height}`;
    }

    function selectHighestResolution(videos) {
      const eligibleVideos = videos.filter((video) => {
        const duration = Number(video.duration || 0);
        return duration >= MIN_DURATION_SECONDS && duration <= MAX_DURATION_SECONDS;
      });
      const files = eligibleVideos.flatMap((video) => {
        const videoFiles = Array.isArray(video.video_files) ? video.video_files : [];
        return videoFiles
          .filter((file) => file.link && isAllowedYoutubeFormat(file))
          .map((file) => ({
            link: file.link,
            width: Number(file.width || 0),
            height: Number(file.height || 0),
            duration: Number(video.duration || 0),
            label: formatLabel(Number(file.width || 0), Number(file.height || 0))
          }));
      });

      files.sort((a, b) => b.width - a.width || b.height - a.height);
      return files[0] || null;
    }

    async function findVideoForSegment(query) {
      const attempts = [
        query,
        query.split(/\s+/)[0],
        FALLBACK_QUERY
      ].filter((value, index, list) => value && list.indexOf(value) === index);

      for (const attempt of attempts) {
        const videos = await searchPexels(attempt);
        const selectedFile = selectHighestResolution(videos);

        if (selectedFile) {
          return {
            query: attempt,
            file: selectedFile
          };
        }
      }

      return null;
    }

    async function downloadVideo(segmentIndex, videoUrl) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          action: 'download',
          segment: segmentIndex,
          url: videoUrl
        })
      });
      const payload = await response.json();

      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || `Download failed for segment ${segmentIndex}.`);
      }

      return payload.path;
    }

    async function processSegments(segments, runId) {
      isProcessing = true;
      resetStatus(segments);
      setMessage(`Processing ${segments.length} segment${segments.length === 1 ? '' : 's'}...`);

      for (const segment of segments) {
        if (runId !== currentRunId) {
          return;
        }

        try {
          updateStatus(segment.index, `Searching: ${segment.query}`);
          const selected = await findVideoForSegment(segment.query);

          if (runId !== currentRunId) {
            return;
          }

          if (!selected) {
            updateStatus(segment.index, 'No Full HD 1920x1080 or HD 1280x720 horizontal video found after fallback attempts.');
            continue;
          }

          updateStatus(segment.index, `Downloading and re-encoding from query "${selected.query}" (${selected.file.label}, ${selected.file.duration}s)...`);
          const localPath = await downloadVideo(segment.index, selected.file.link);

          if (runId !== currentRunId) {
            return;
          }

          updateStatus(segment.index, `Saved to ${localPath} as H.264 1080p CFR`, localPath);
        } catch (error) {
          if (runId !== currentRunId) {
            return;
          }

          updateStatus(segment.index, error.message);
        }
      }

      if (runId === currentRunId) {
        setMessage('Processing complete.');
        isProcessing = false;
      }
    }

    function scheduleAutoRun() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const value = input.value.trim();

        if (!value) {
          setMessage('');
          statusList.innerHTML = '';
          return;
        }

        let segments;
        try {
          segments = parseSegments(value);
        } catch (error) {
          setMessage(error.message, true);
          return;
        }

        const signature = JSON.stringify(segments.map(({ index, query, start, end, text }) => ({
          index,
          query,
          start,
          end,
          text
        })));

        if (signature === lastRunSignature && isProcessing) {
          return;
        }

        currentRunId += 1;
        lastRunSignature = signature;
        processSegments(segments, currentRunId);
      }, 350);
    }

    input.addEventListener('input', scheduleAutoRun);
    input.addEventListener('paste', scheduleAutoRun);
  </script>
</body>
</html>
